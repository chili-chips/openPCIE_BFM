# When several annotations match a file, the LAST one in this file wins.
#   precedence = "closest"  -> a file's own SPDX header wins; this is the fallback

version = 1

# Our own files: wrappers, PIPE adapters, the Artix-7 RC model, tools,
# self-test, docs. A file's own SPDX header wins (pcieVHostPipexN.sv is
# GPL-3.0-or-later, derived from upstream's pcieVHostPipex1).
[[annotations]]
path = ["**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 CHILI.CHIPS.LLC"
SPDX-License-Identifier = "BSD-3-Clause"

# wyvernSemi co-simulation VIP by Simon Southwell (VProc, pcieVHost,
# mem_model), our changes to it (patches, the LTSSM helper, the mem_model
# lint wrapper 2.rtl/mem_model.sv), and the
# pcieVHost manual's summary with its pictures.
[[annotations]]
path = ["1.upstream/vip/**", "1.upstream/patches/**", "3.sw/ltssm/**", "1.upstream/pcievhost-guide/**", "2.rtl/mem_model.sv"]
precedence = "closest"
SPDX-FileCopyrightText = "2004-2025 Simon Southwell"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Redrawn for openPCIE_BFM from Simon Southwell's figures (contributed to
# openPCIE): pcieVHost architecture, pcieVHostPipex1, VProc and mem_model.
[[annotations]]
path = ["0.doc/images/pcievhost-architecture.drawio*", "0.doc/images/pcievhost-pipe-wrapper.drawio*", "0.doc/images/vproc-component.drawio*", "0.doc/images/mem-model-component.drawio*"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 CHILI.CHIPS.LLC", "2025 Simon Southwell (original figures)"]
SPDX-License-Identifier = "BSD-3-Clause"

# Third-party logos, shown for acknowledgment only (NOT open-licensed)
[[annotations]]
path = ["0.doc/artwork/**"]
precedence = "override"
SPDX-FileCopyrightText = "Respective owners"
SPDX-License-Identifier = "LicenseRef-Third-Party-Document"

# ... except our index of the upstream copies
[[annotations]]
path = ["1.upstream/vip/README.md"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 CHILI.CHIPS.LLC"
SPDX-License-Identifier = "BSD-3-Clause"

# our own logo, in 0.doc/artwork with the third-party ones
[[annotations]]
path = ["0.doc/artwork/openPCIE_BFM.hex.*", "0.doc/artwork/pcie2rootc.hex.png", "0.doc/artwork/openCologne-PCIE.hex.png"]
precedence = "override"
SPDX-FileCopyrightText = "2026 CHILI.CHIPS.LLC"
SPDX-License-Identifier = "BSD-3-Clause"
